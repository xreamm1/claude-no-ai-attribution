name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release with SKILL.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            skills/no-ai-attribution/SKILL.md \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Download \`SKILL.md\` and put it in \`~/.claude/skills/no-ai-attribution/SKILL.md\` (all projects) or \`<repo>/.claude/skills/no-ai-attribution/SKILL.md\` (one repository). For the full setup, run \`install.sh\` — see the README."
